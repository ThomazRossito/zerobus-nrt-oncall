          "instructions": {
            "text_instructions": [
              {
                "id": "6f58d74b0aec2473a49d8895cefdee6b",
                "content": [
                  "## PURPOSE\n",
                  "- Answer on-call and postmortem questions about the fictional shop of the zerobus-nrt-oncall experiment: services checkout, payment and inventory.\n",
                  "- Users are on-call engineers and readers of the postmortem.\n",
                  "\n",
                  "## DISAMBIGUATION\n",
                  "- \"Was live\", \"in production\" or \"deployed\" at a moment is business time with today's knowledge: catalog_live_at_open in gold.incident_postmortem, or the current rows of silver.services_bitemporal (__SYSTEM_END_AT is NULL).\n",
                  "- \"What the catalog said\", \"what was known\" or \"what we believed\" at a moment is system time as of that moment: catalog_known_at_open, or the silver.services_bitemporal row whose system period contains that moment.\n",
                  "- When a question names an incident by title and several incidents share it, use the latest one by opened_at and say so.\n",
                  "- In silver.services_bitemporal, __SYSTEM_START_AT (known_from) is when the catalog recorded that row, not when it first named the version: a later change, such as a rollback, opens a new row. The first time the catalog named a version is the earliest __SYSTEM_START_AT of that version (first_known in the scenario clock example).\n",
                  "\n",
                  "## DATA QUALITY NOTES\n",
                  "- All timestamps are UTC, the real time of the run. The scenario clock of the story (14:00 to 14:20, the incident at 14:05) is not stored: convert to it only when asked, anchored at the latest checkout incident, as in the scenario clock example.\n",
                  "- Durations are real seconds. The simulator compresses time (speed 12 by default: one real second is 12 seconds of the scenario).\n",
                  "- Incidents that only came in the initial snapshot have no change history: suspected_at_open and the status times are NULL.\n",
                  "\n",
                  "## Instructions you must follow when providing summaries\n",
                  "- For a postmortem question, state both versions: the one that was live and the one the catalog named at the time.\n",
                  "- On the scenario clock, say when the catalog first named the live version from first_known, not from known_from.\n",
                  "- Give times in UTC."
                ]
              }
            ],
            "example_question_sqls": [
              {
                "id": "0d454f3313ca501a2f8cb1cae9c225cf",
                "question": [
                  "What was the checkout error rate by version during the latest incident?"
                ],
                "sql": [
                  "WITH incident AS (\n",
                  "  SELECT incident_postmortem.opened_at, incident_postmortem.resolved_at\n",
                  "  FROM ${var.catalog}.gold.incident_postmortem\n",
                  "  WHERE incident_postmortem.service = 'checkout'\n",
                  "  ORDER BY incident_postmortem.opened_at DESC\n",
                  "  LIMIT 1\n",
                  ")\n",
                  "SELECT\n",
                  "  service_health.version,\n",
                  "  sum(service_health.requests) AS requests,\n",
                  "  sum(service_health.errors) AS errors,\n",
                  "  round(sum(service_health.errors) / sum(service_health.requests), 4) AS error_rate\n",
                  "FROM ${var.catalog}.gold.service_health\n",
                  "JOIN incident\n",
                  "  ON service_health.bucket_start >= incident.opened_at\n",
                  " AND service_health.bucket_start < coalesce(incident.resolved_at, current_timestamp())\n",
                  "WHERE service_health.service = 'checkout'\n",
                  "GROUP BY service_health.version\n",
                  "ORDER BY service_health.version"
                ],
                "usage_guidance": [
                  "Requests, errors and error rate per version of a service between the opening and the resolution of an incident."
                ]
              },
              {
                "id": "1b4ad699095219523db5a75c999ae987",
                "question": [
                  "Which checkout operations failed during the latest incident, by version, and how slow were they?"
                ],
                "sql": [
                  "WITH incident AS (\n",
                  "  SELECT incident_postmortem.opened_at, incident_postmortem.resolved_at\n",
                  "  FROM ${var.catalog}.gold.incident_postmortem\n",
                  "  WHERE incident_postmortem.service = 'checkout'\n",
                  "  ORDER BY incident_postmortem.opened_at DESC\n",
                  "  LIMIT 1\n",
                  ")\n",
                  "SELECT\n",
                  "  shop_otel_spans.name AS operation,\n",
                  "  shop_otel_spans.resource.attributes:['service.version']::string AS version,\n",
                  "  count(*) AS spans,\n",
                  "  count_if(shop_otel_spans.status.code = 'STATUS_CODE_ERROR') AS errors,\n",
                  "  round(percentile_approx((shop_otel_spans.end_time_unix_nano - shop_otel_spans.start_time_unix_nano) / 1000000, 0.95), 1) AS p95_ms\n",
                  "FROM ${var.catalog}.otel.shop_otel_spans\n",
                  "JOIN incident\n",
                  "  ON shop_otel_spans.time >= incident.opened_at\n",
                  " AND shop_otel_spans.time < coalesce(incident.resolved_at, current_timestamp())\n",
                  "WHERE shop_otel_spans.service_name = 'checkout'\n",
                  "GROUP BY ALL\n",
                  "ORDER BY errors DESC, spans DESC"
                ],
                "usage_guidance": [
                  "Operations of a service per version in the window of an incident: spans, errors and p95 duration."
                ]
              },
              {
                "id": "5248ecfc7a94d60cb26ec0f806d1130b",
                "question": [
                  "How long did the latest checkout incident take to be mitigated and resolved?"
                ],
                "sql": [
                  "SELECT\n",
                  "  incident_postmortem.incident_id,\n",
                  "  incident_postmortem.title,\n",
                  "  incident_postmortem.opened_at,\n",
                  "  incident_postmortem.mitigated_at,\n",
                  "  incident_postmortem.resolved_at,\n",
                  "  incident_postmortem.seconds_to_mitigate,\n",
                  "  incident_postmortem.seconds_to_resolve\n",
                  "FROM ${var.catalog}.gold.incident_postmortem\n",
                  "WHERE incident_postmortem.service = 'checkout'\n",
                  "  AND incident_postmortem.resolved_at IS NOT NULL\n",
                  "ORDER BY incident_postmortem.opened_at DESC\n",
                  "LIMIT 1"
                ],
                "usage_guidance": [
                  "Time from opening to mitigation and to resolution of an incident, in real seconds."
                ]
              },
              {
                "id": "57fbbecf800212b46923791de4ea8534",
                "question": [
                  "When was the service catalog wrong about the checkout version?"
                ],
                "sql": [
                  "SELECT\n",
                  "  errors_by_version.bucket_start,\n",
                  "  errors_by_version.telemetry_version,\n",
                  "  errors_by_version.catalog_known_version,\n",
                  "  errors_by_version.catalog_live_version,\n",
                  "  errors_by_version.requests,\n",
                  "  errors_by_version.error_rate\n",
                  "FROM ${var.catalog}.gold.errors_by_version\n",
                  "WHERE errors_by_version.service = 'checkout'\n",
                  "  AND NOT errors_by_version.catalog_was_right\n",
                  "ORDER BY errors_by_version.bucket_start"
                ],
                "usage_guidance": [
                  "Buckets where the version in the telemetry differs from the version the catalog named at that moment."
                ]
              },
              {
                "id": "5a5e350e64db186a095f1918c128d484",
                "question": [
                  "What are the p50 and p95 latencies from the Postgres commit to Debezium?"
                ],
                "sql": [
                  "SELECT\n",
                  "  hop_latency.source_table,\n",
                  "  count(*) AS changes,\n",
                  "  percentile_approx(hop_latency.capture_ms, 0.5) AS p50_capture_ms,\n",
                  "  percentile_approx(hop_latency.capture_ms, 0.95) AS p95_capture_ms,\n",
                  "  max(hop_latency.capture_ms) AS max_capture_ms\n",
                  "FROM ${var.catalog}.gold.hop_latency\n",
                  "GROUP BY hop_latency.source_table\n",
                  "ORDER BY hop_latency.source_table"
                ],
                "usage_guidance": [
                  "Capture latency of the CDC path per Postgres table, from the commit to Debezium."
                ]
              },
              {
                "id": "660b12b16eae435116917d940cac67d3",
                "question": [
                  "What error messages did checkout log, by version, during the latest incident?"
                ],
                "sql": [
                  "WITH incident AS (\n",
                  "  SELECT incident_postmortem.opened_at, incident_postmortem.resolved_at\n",
                  "  FROM ${var.catalog}.gold.incident_postmortem\n",
                  "  WHERE incident_postmortem.service = 'checkout'\n",
                  "  ORDER BY incident_postmortem.opened_at DESC\n",
                  "  LIMIT 1\n",
                  ")\n",
                  "SELECT\n",
                  "  shop_otel_logs.resource.attributes:['service.version']::string AS version,\n",
                  "  shop_otel_logs.body::string AS message,\n",
                  "  count(*) AS logs\n",
                  "FROM ${var.catalog}.otel.shop_otel_logs\n",
                  "JOIN incident\n",
                  "  ON shop_otel_logs.time >= incident.opened_at\n",
                  " AND shop_otel_logs.time < coalesce(incident.resolved_at, current_timestamp())\n",
                  "WHERE shop_otel_logs.service_name = 'checkout'\n",
                  "  AND shop_otel_logs.severity_text = 'ERROR'\n",
                  "GROUP BY ALL\n",
                  "ORDER BY logs DESC"
                ],
                "usage_guidance": [
                  "Error log messages of a service per version in the window of an incident, from the OpenTelemetry logs."
                ]
              },
              {
                "id": "d85c0203602f5f0800ae205e06b8400c",
                "question": [
                  "Which checkout version was live when the latest 'Checkout error rate above 5%' incident opened, and which version did the service catalog name at that moment?"
                ],
                "sql": [
                  "SELECT\n",
                  "  incident_postmortem.incident_id,\n",
                  "  incident_postmortem.title,\n",
                  "  incident_postmortem.opened_at,\n",
                  "  incident_postmortem.catalog_live_at_open,\n",
                  "  incident_postmortem.catalog_known_at_open,\n",
                  "  incident_postmortem.suspected_at_open,\n",
                  "  incident_postmortem.telemetry_version_at_open\n",
                  "FROM ${var.catalog}.gold.incident_postmortem\n",
                  "WHERE incident_postmortem.service = 'checkout'\n",
                  "  AND incident_postmortem.title = 'Checkout error rate above 5%'\n",
                  "ORDER BY incident_postmortem.opened_at DESC\n",
                  "LIMIT 1"
                ],
                "usage_guidance": [
                  "Which version was live when an incident opened, and which version the service catalog named at that moment: the two postmortem answers."
                ]
              },
              {
                "id": "fe6662845f10588a7c62522668a9ad35",
                "question": [
                  "On the scenario clock, which checkout version was live at 14:05 and what did the catalog say at that moment, with live_from, live_until, known_from and known_until?"
                ],
                "sql": [
                  "WITH incident AS (\n",
                  "  SELECT incident_postmortem.opened_at AS t\n",
                  "  FROM ${var.catalog}.gold.incident_postmortem\n",
                  "  WHERE incident_postmortem.service = 'checkout'\n",
                  "    AND incident_postmortem.title = 'Checkout error rate above 5%'\n",
                  "  ORDER BY incident_postmortem.opened_at DESC\n",
                  "  LIMIT 1\n",
                  "),\n",
                  "answers AS (\n",
                  "  SELECT 'was live at 14:05' AS question, services_bitemporal.version,\n",
                  "    services_bitemporal.__START_AT AS live_start, services_bitemporal.__END_AT AS live_end,\n",
                  "    services_bitemporal.__SYSTEM_START_AT AS known_start, services_bitemporal.__SYSTEM_END_AT AS known_end\n",
                  "  FROM ${var.catalog}.silver.services_bitemporal CROSS JOIN incident\n",
                  "  WHERE services_bitemporal.service = 'checkout'\n",
                  "    AND services_bitemporal.__START_AT <= incident.t\n",
                  "    AND (services_bitemporal.__END_AT > incident.t OR services_bitemporal.__END_AT IS NULL)\n",
                  "    AND services_bitemporal.__SYSTEM_END_AT IS NULL\n",
                  "  UNION ALL\n",
                  "  SELECT 'catalog said at 14:05', services_bitemporal.version,\n",
                  "    services_bitemporal.__START_AT, services_bitemporal.__END_AT,\n",
                  "    services_bitemporal.__SYSTEM_START_AT, services_bitemporal.__SYSTEM_END_AT\n",
                  "  FROM ${var.catalog}.silver.services_bitemporal CROSS JOIN incident\n",
                  "  WHERE services_bitemporal.service = 'checkout'\n",
                  "    AND services_bitemporal.__START_AT <= incident.t\n",
                  "    AND (services_bitemporal.__END_AT > incident.t OR services_bitemporal.__END_AT IS NULL)\n",
                  "    AND services_bitemporal.__SYSTEM_START_AT <= incident.t\n",
                  "    AND (services_bitemporal.__SYSTEM_END_AT > incident.t OR services_bitemporal.__SYSTEM_END_AT IS NULL)\n",
                  "),\n",
                  "first_named AS (\n",
                  "  SELECT services_bitemporal.version, min(services_bitemporal.__SYSTEM_START_AT) AS first_start\n",
                  "  FROM ${var.catalog}.silver.services_bitemporal\n",
                  "  WHERE services_bitemporal.service = 'checkout'\n",
                  "  GROUP BY services_bitemporal.version\n",
                  ")\n",
                  "SELECT\n",
                  "  answers.question,\n",
                  "  answers.version,\n",
                  "  CASE WHEN answers.live_start IS NULL THEN 'open'\n",
                  "       WHEN answers.live_start < incident.t - INTERVAL 25 SECONDS THEN 'before the run'\n",
                  "       ELSE format_string('14:%02d', CAST(floor(round(300 + (unix_micros(answers.live_start) - unix_micros(incident.t)) * 12 / 1000000) / 60) AS INT))\n",
                  "  END AS live_from,\n",
                  "  CASE WHEN answers.live_end IS NULL THEN 'open'\n",
                  "       WHEN answers.live_end < incident.t - INTERVAL 25 SECONDS THEN 'before the run'\n",
                  "       ELSE format_string('14:%02d', CAST(floor(round(300 + (unix_micros(answers.live_end) - unix_micros(incident.t)) * 12 / 1000000) / 60) AS INT))\n",
                  "  END AS live_until,\n",
                  "  CASE WHEN answers.known_start IS NULL THEN 'open'\n",
                  "       WHEN answers.known_start < incident.t - INTERVAL 25 SECONDS THEN 'before the run'\n",
                  "       ELSE format_string('14:%02d', CAST(floor(round(300 + (unix_micros(answers.known_start) - unix_micros(incident.t)) * 12 / 1000000) / 60) AS INT))\n",
                  "  END AS known_from,\n",
                  "  CASE WHEN answers.known_end IS NULL THEN 'open'\n",
                  "       WHEN answers.known_end < incident.t - INTERVAL 25 SECONDS THEN 'before the run'\n",
                  "       ELSE format_string('14:%02d', CAST(floor(round(300 + (unix_micros(answers.known_end) - unix_micros(incident.t)) * 12 / 1000000) / 60) AS INT))\n",
                  "  END AS known_until,\n",
                  "  CASE WHEN first_named.first_start < incident.t - INTERVAL 25 SECONDS THEN 'before the run'\n",
                  "       ELSE format_string('14:%02d', CAST(floor(round(300 + (unix_micros(first_named.first_start) - unix_micros(incident.t)) * 12 / 1000000) / 60) AS INT))\n",
                  "  END AS first_known\n",
                  "FROM answers CROSS JOIN incident\n",
                  "JOIN first_named ON first_named.version = answers.version"
                ],
                "usage_guidance": [
                  "Only when the user asks for the scenario clock (14:00 to 14:20 of the story): the two postmortem answers with their periods converted from UTC, anchored at the latest checkout incident, which opened at 14:05. known_from is when the catalog recorded that row, not when it first named the version; first_known is when it first named it."
                ]
              }
            ]
          }
        }
