# Phase 4 · the Genie Agent of the on-call scenario: five Phase 3 tables and two OpenTelemetry tables with column
# descriptions, eight sample questions with example SQL, and one block of instructions. genie_spaces needs the direct deployment engine, the
# default (Databricks CLI 1.3.0+). serialized_space is version 2 of the Genie Agents API, written inline so that
# ${var.catalog} reaches the table names. The API rejects unsorted lists and ids that are not 32 lowercase hex
# characters: tables are sorted by identifier, column_configs by column_name, the rest by id.

resources:
  genie_spaces:
    oncall_genie:
      title: "On-call postmortem · zerobus-nrt-oncall"
      description: >-
        On-call and postmortem questions about the fictional shop of the zerobus-nrt-oncall experiment
        (checkout, payment, inventory): which version of a service was live versus what the service catalog
        said at that moment (bitemporal history with live_from, live_until, known_from and known_until), in
        UTC or on the scenario clock of the story, where the latest checkout incident opens at 14:05;
        incidents and how long they took; error rate, latency, error messages and operations per service and
        version from OpenTelemetry spans and logs; and how long database changes took to reach Debezium.
      warehouse_id: ${var.warehouse_id}
      serialized_space: |
        {
          "version": 2,
          "config": {
            "sample_questions": [
              {
                "id": "57006c6aa87f11803ae3faf6b1cc9acf",
                "question": [
                  "On the scenario clock, which checkout version was live at 14:05 and what did the catalog say at that moment, with live_from, live_until, known_from and known_until?"
                ]
              },
              {
                "id": "5ace0a61dad30f39d0d61fde2da9add8",
                "question": [
                  "How long did the latest checkout incident take to be mitigated and resolved?"
                ]
              },
              {
                "id": "5cb760b74954aece3f5d4f12796cb3ab",
                "question": [
                  "What was the checkout error rate by version during the latest incident?"
                ]
              },
              {
                "id": "9904504297762033990f6229ec2102e8",
                "question": [
                  "Which checkout version was live when the latest 'Checkout error rate above 5%' incident opened, and which version did the service catalog name at that moment?"
                ]
              },
              {
                "id": "9a1806e03d1cf16b4c3be3f600be141a",
                "question": [
                  "Which checkout operations failed during the latest incident, by version, and how slow were they?"
                ]
              },
              {
                "id": "a67da302585c298f5ae2ae036aeb05b5",
                "question": [
                  "When was the service catalog wrong about the checkout version?"
                ]
              },
              {
                "id": "caaaf6ca9be70247fd555febd2853193",
                "question": [
