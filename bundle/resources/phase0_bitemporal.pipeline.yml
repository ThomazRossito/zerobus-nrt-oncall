# Phase 0 · minimal AUTO CDC bitemporal test: confirms the feature (Beta) runs in this workspace.
# Reads bronze.phase0_bitemporal_source and writes silver.phase0_bitemporal. Still in the bundle after Phase 3:
# taking it out deletes the pipeline and its table on the next deploy, so that waits for a decision.

resources:
  pipelines:
    phase0_bitemporal:
      name: zerobus_nrt_oncall_phase0_bitemporal
      catalog: ${var.catalog}
      schema: silver
      serverless: true
      continuous: false
      channel: ${var.channel}
      root_path: ../src/phase0
      libraries:
        - glob:
            include: ../src/phase0/phase0_bitemporal.sql
      tags:
        project: zerobus-nrt-oncall
