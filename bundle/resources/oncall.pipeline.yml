# Phase 3 · the on-call pipeline, in SQL on serverless: silver (the changes, AUTO CDC SCD1, SCD2 and bitemporal) and
# gold. Reads bronze.services and bronze.incidents (CDC through Zerobus) and otel.shop_otel_spans (OTLP through
# Zerobus); bronze.alerts_history stays out. The default schema is silver; the gold files name their tables
# gold.<table>, in the same catalog. Triggered in Phase 3; Phase 6 runs it continuous to measure the hops.
# Deployed and run by: python setup/03_pipeline.py run

resources:
  pipelines:
    oncall:
      name: zerobus_nrt_oncall
      catalog: ${var.catalog}
      schema: silver
      serverless: true
      continuous: false
      channel: ${var.channel}
      root_path: ../src/pipeline
      libraries:
        - glob:
            include: ../src/pipeline/**
      tags:
        project: zerobus-nrt-oncall
