# Phase 2 · Debezium Server 3.8.0.Alpha2: Postgres (schema cmdb) -> Zerobus Ingest -> <catalog>.bronze.<table>.
# ingest/debezium/run.sh copies this file into the distribution and starts it; ingest/debezium/run_parallel.py
# writes one copy per instance, with the snapshot keys of that instance. No secrets here: every ${...} comes
# from the shell environment (set -a; source .env; set +a). The knobs of the debezium/dbz#3026 scenarios have a
# default after the colon and can be overridden with an environment variable of the same name.

# ---- Sink: Databricks Zerobus Ingest, gRPC route, typed rows ----
debezium.sink.type=zerobus
debezium.sink.zerobus.endpoint=${ZEROBUS_SERVER_ENDPOINT}
debezium.sink.zerobus.workspace.url=${DATABRICKS_WORKSPACE_URL}
debezium.sink.zerobus.client.id=${DATABRICKS_CLIENT_ID}
debezium.sink.zerobus.client.secret=${DATABRICKS_CLIENT_SECRET}
debezium.sink.zerobus.payload.mode=typed
debezium.sink.zerobus.flush.warn.threshold.ms=${ZEROBUS_FLUSH_WARN_MS:30000}
debezium.sink.zerobus.metrics.log.interval=${ZEROBUS_METRICS_LOG_INTERVAL:0}
# records sent to Zerobus and not acknowledged yet; at the limit, sending waits. The sink's default is 50000, below a
# batch of 51200; part 1 loaded its 94 million rows with 100000 (scenario 1c of debezium/dbz#3026 checks the difference)
debezium.sink.zerobus.max.inflight.records=${ZEROBUS_MAX_INFLIGHT:50000}

# ---- Source: local Postgres, the PG_DBNAME database, schema cmdb ----
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=${DBZ_OFFSETS_FILE}
debezium.source.offset.flush.interval.ms=0
debezium.source.database.hostname=${PG_HOST}
debezium.source.database.port=${PG_PORT}
debezium.source.database.user=${PG_USER}
debezium.source.database.password=${PG_PASSWORD}
debezium.source.database.dbname=${PG_DBNAME}
debezium.source.topic.prefix=${UC_CATALOG}
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=oncall_cdc
debezium.source.publication.name=oncall_cdc
debezium.source.publication.autocreate.mode=disabled
debezium.source.table.include.list=cmdb.services,cmdb.incidents,cmdb.alerts_history
# initial: the snapshot, then the CDC. After the load of run_parallel.py: DBZ_SNAPSHOT_MODE=no_data (only the CDC,
# from a new slot)
debezium.source.snapshot.mode=${DBZ_SNAPSHOT_MODE:initial}
debezium.source.decimal.handling.mode=precise
debezium.source.time.precision.mode=adaptive
debezium.source.max.batch.size=${DBZ_MAX_BATCH_SIZE:2048}
debezium.source.max.queue.size=${DBZ_MAX_QUEUE_SIZE:8192}

# ---- Format: plain JSON, no embedded schemas ----
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

# ---- Transforms: flatten each change, then route cmdb to bronze ----
# unwrap adds __op, __ts_ms, __source_ts_ms and __lsn, and turns a delete into a row with __deleted = "true"
debezium.transforms=unwrap,route
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
debezium.transforms.unwrap.delete.tombstone.handling.mode=rewrite
debezium.transforms.unwrap.add.fields=op,ts_ms,source.ts_ms,lsn
# the Zerobus sink writes to the topic name (catalog.schema.table): <catalog>.cmdb.<table> -> <catalog>.bronze.<table>
debezium.transforms.route.type=org.apache.kafka.connect.transforms.RegexRouter
debezium.transforms.route.regex=([^.]+)\\.cmdb\\.(.+)
debezium.transforms.route.replacement=$1.bronze.$2

# ---- Logging ----
# Debezium Server 3.8 logs JSON by default; plain text is easier to read and to mask. The distribution's example uses
# quarkus.log.console.json=false, which Quarkus 3.40 warns is deprecated; this is the current property.
quarkus.log.console.json.enabled=false
quarkus.log.level=INFO
# the Zerobus SDK; ZEROBUS_SDK_LOG_LEVEL=INFO shows its stream recovery while a test runs
quarkus.log.category."com.databricks.zerobus".level=${ZEROBUS_SDK_LOG_LEVEL:WARN}
